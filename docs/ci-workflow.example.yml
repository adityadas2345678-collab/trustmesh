name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pins && npm run test:shared && npm run test:contracts && npm run test:api
      - run: npm run test:e2e
      - run: npm run build
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio==6.1.18
      - run: cp firmware/include/secrets.example.h firmware/include/secrets.h
      - run: cd firmware && pio test -e native && pio run -e core -e env -e wet -e act -e full_a -e full_b
