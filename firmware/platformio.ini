; TRUSTMESH firmware — PlatformIO + Arduino-ESP32. Reference board: ESP32-DevKitC (WROOM-32).
; Build:   pio run -e core            Upload: pio run -e core -t upload --upload-port <port>
; Monitor: pio device monitor -b 115200   (close it before running `npm run bridge`)
[platformio]
default_envs = core

[esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -Wall -DCORE_DEBUG_LEVEL=0
lib_deps =
  miguelbalboa/MFRC522@1.4.11
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.14
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0
  madhephaestus/ESP32Servo@3.0.6
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@7.2.1
build_src_filter = +<*>

[env:core]
extends = esp32
build_flags = ${esp32.build_flags} -DTM_PROFILE_CORE
[env:env]
extends = esp32
build_flags = ${esp32.build_flags} -DTM_PROFILE_ENV
[env:wet]
extends = esp32
build_flags = ${esp32.build_flags} -DTM_PROFILE_WET
[env:act]
extends = esp32
build_flags = ${esp32.build_flags} -DTM_PROFILE_ACT
[env:full_a]
extends = esp32
build_flags = ${esp32.build_flags} -DTM_PROFILE_FULL_A
[env:full_b]
extends = esp32
build_flags = ${esp32.build_flags} -DTM_PROFILE_FULL_B

; ── Newrro kit (ESP32-S3 controller). Native-USB builds put Serial on the USB-C port (ESP32-S3 USB CDC).
;    If your box shows up as a CH340/CP210x serial port instead, use the *_uart environment.
[newrro]
extends = esp32
board = esp32-s3-devkitc-1
; conservative: fits 4 MB, 8 MB and 16 MB flash modules
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = ${esp32.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
[env:newrro_min]
extends = newrro
build_flags = ${newrro.build_flags} -DTM_PROFILE_NEWRRO_MIN
[env:newrro_full]
extends = newrro
build_flags = ${newrro.build_flags} -DTM_PROFILE_NEWRRO_FULL
[env:newrro_full_uart]
extends = newrro
build_flags = ${esp32.build_flags} -DTM_PROFILE_NEWRRO_FULL

; Host-side unit tests of the protocol (HMAC preimage, SHA-256, base64) against shared test vectors.
[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=gnu++17 -DTM_NATIVE
build_src_filter = -<*>
test_build_src = no
